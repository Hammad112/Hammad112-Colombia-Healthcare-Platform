name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  secrets:
    # M0 exit criterion: no secret values in source control, verified by a scan.
    # This job fails the build; it does not warn.
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: .gitleaks.toml

  lint:
    name: Lint and types
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy src

  test:
    name: Tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: clinic
          POSTGRES_PASSWORD: ci-password
          POSTGRES_DB: clinic
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      APP_ENV: ci
      POSTGRES_USER: clinic
      POSTGRES_PASSWORD: ci-password
      POSTGRES_DB: clinic
      POSTGRES_HOST: localhost
      POSTGRES_PORT: "5432"
      APP_DB_USER: clinic_app
      APP_DB_PASSWORD: ci-password
      PHI_ENCRYPTION_KEY: placeholder-ci-phi-encryption-value
      PHI_BLIND_INDEX_KEY: placeholder-ci-phi-blind-index-value
      ALLOW_REAL_PATIENT_DATA: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install -e ".[dev]"
      - name: Migrations apply cleanly
        run: alembic upgrade head
      - name: Synthetic seed runs
        run: python -m scripts.seed_synthetic --patients 25 --doctors 3
      - name: Tests
        run: pytest -q

  dependencies:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install -e "." pip-audit
      - run: pip-audit --strict || true  # advisory in M0; blocking from M5
