# Secret-scanning configuration.
#
# The allowlists below are deliberately narrow. Anything broader would defeat
# the point of the scan, which is an M0 exit criterion: no secret values in
# source control, verified automatically and enforced by a failing build.

[extend]
useDefault = true

[[allowlists]]
description = "Local virtualenvs, caches and build output are not our source"
paths = [
  '''(^|/)\.venv/''',
  '''(^|/)venv/''',
  '''(^|/)node_modules/''',
  '''(^|/)\.mypy_cache/''',
  '''(^|/)\.ruff_cache/''',
  '''(^|/)\.pytest_cache/''',
  '''(^|/)dist/''',
  '''(^|/)build/''',
]

[[allowlists]]
description = """
Deterministic, non-secret placeholder keys used by the test suite and the
example environment file. These unlock nothing: they exist so tests are
reproducible and so a developer can see the shape of a value. Real keys are
resolved at runtime from the secrets manager, and the application refuses to
start on a placeholder outside local environments (see src/core/config.py).
"""
paths = [
  '''^tests/conftest\.py$''',
  '''^\.env\.example$''',
  '''^\.github/workflows/ci\.yml$''',
  '''^docker-compose\.yml$''',
]
regexes = [
  '''test-key-[A-Za-z0-9]*''',
  '''test-bidx-[A-Za-z0-9]*''',
  '''ci-key-[A-Za-z0-9]*''',
  '''ci-bidx-[A-Za-z0-9]*''',
  '''local-dev-(key|bidx)-not-for-production-\d*''',
  '''change-me-locally''',
  '''ci-password''',
]
