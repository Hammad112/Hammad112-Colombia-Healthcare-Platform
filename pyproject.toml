[project]
name = "clinic-scheduler"
version = "0.1.0"
description = "AI-powered medical appointment scheduling platform for clinics in Colombia"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.14,<2",
    "cryptography>=43",
    "fastapi>=0.121,<1",
    "langgraph>=1.0,<2",
    "langgraph-checkpoint-postgres>=3.0,<4",
    "psycopg[binary,pool]>=3.2,<4",
    "pydantic>=2.9,<3",
    "pydantic-settings>=2.6,<3",
    "sqlalchemy[asyncio]>=2.0.36,<2.1",
    "structlog>=24.4",
    "uvicorn[standard]>=0.36,<1",
]

[project.optional-dependencies]
# Synthetic data generation (src/devdata). Not needed where real data is served.
seed = [
    "faker>=30",
]
dev = [
    "clinic-scheduler[seed]",
    "httpx>=0.27",
    "mypy>=1.13",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "S", "ASYNC", "SIM", "RUF"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
# Assertions and fixed test credentials are expected in tests.
"tests/**" = ["S101", "S105", "S106"]
# Synthetic data deliberately uses a non-cryptographic seeded generator.
"src/devdata/**" = ["S311"]
# The migration builds DDL from a validated identifier and fixed value lists.
"migrations/**" = ["S608"]

[tool.ruff.lint.isort]
known-first-party = ["src", "main"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = ["faker.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
filterwarnings = [
    "error::DeprecationWarning:src.*",
]
