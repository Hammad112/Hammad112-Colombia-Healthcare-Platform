[project]
name = "clinic-scheduler"
version = "0.1.0"
description = "AI-powered medical appointment scheduling platform for clinics in Colombia"
readme = "README.md"
# Container runs 3.13 (see Dockerfile); 3.12 is allowed so local dev is not blocked.
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy[asyncio]>=2.0.36",
    "psycopg[binary,pool]>=3.2",
    "alembic>=1.14",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "structlog>=24.4",
    "cryptography>=43.0",
    "phonenumbers>=8.13",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
    "faker>=30.0",
    "ruff>=0.7",
    "mypy>=1.13",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "S", "ASYNC"]
# S101 (assert) is fine in tests; configured per-file below.
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
# Tests assert, and carry throwaway credentials by design.
"tests/**" = ["S101", "S105", "S106"]
# Synthetic data uses non-cryptographic randomness deliberately.
"scripts/**" = ["S311", "S101"]
# FastAPI's dependency-injection idiom is a call in an argument default.
"src/api/**" = ["B008"]
# Migrations interpolate validated identifiers into DDL.
"migrations/**" = ["S608"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_ignores = true
plugins = []

[[tool.mypy.overrides]]
module = ["faker.*", "phonenumbers.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
# Our own deprecations are errors; third-party ones are not our build to break.
filterwarnings = [
    "error::DeprecationWarning:src.*",
    "ignore::DeprecationWarning",
]
