# One command brings the whole stack up (M0 exit criterion):
#   docker compose up --build
# The api service runs main.py, which migrates, seeds synthetic data and serves.

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-clinic}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me-locally}
      POSTGRES_DB: ${POSTGRES_DB:-clinic}
    ports:
      # Host port follows POSTGRES_PORT in .env (default 5433, so it does not clash
      # with a PostgreSQL already installed on 5432). The api container always
      # talks to db:5432 on the internal network, whatever this is set to.
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-clinic} -d ${POSTGRES_DB:-clinic}"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      APP_ENV: ${APP_ENV:-local}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      POSTGRES_USER: ${POSTGRES_USER:-clinic}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me-locally}
      POSTGRES_DB: ${POSTGRES_DB:-clinic}
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      APP_DB_USER: ${APP_DB_USER:-clinic_app}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:-change-me-locally}
      PHI_ENCRYPTION_KEY: ${PHI_ENCRYPTION_KEY:-local-dev-key-not-for-production-0000}
      PHI_BLIND_INDEX_KEY: ${PHI_BLIND_INDEX_KEY:-local-dev-bidx-not-for-production-000}
      ALLOW_REAL_PATIENT_DATA: ${ALLOW_REAL_PATIENT_DATA:-false}
      RATE_LIMIT_PER_MINUTE: ${RATE_LIMIT_PER_MINUTE:-60}
    # main.py migrates, seeds (local only) and serves: the same single entry point as local runs.
    command: ["python", "main.py", "--host", "0.0.0.0", "--port", "8000"]
    ports:
      - "8000:8000"

volumes:
  pgdata:
